[package]
name = "hinoko"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hinoko: a native desktop app for persistent bots."

[dependencies]
hinoko-core = { path = "../hinoko-core" }
eframe = "0.37"
egui_commonmark = { version = "0.26", default-features = false, features = ["pulldown_cmark"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "io-util"] }
serde_json = "1"
base64 = "0.22"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

[features]
default = ["builtin"]
builtin = ["hinoko-core/builtin"]

[build-dependencies]
winresource = "0.1"
