name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tag must match the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} does not match Cargo.toml version $v" }
      # tests in release mode share the build with the app, so it compiles once
      - run: cargo test --workspace --release
      - run: cargo build --release -p hinoko
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $env:HINOKO_VERSION = "${{ github.ref_name }}".TrimStart("v")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\hinoko.iss
      - uses: actions/upload-artifact@v5
        with:
          name: Hinoko-Setup
          path: dist/Hinoko-Setup.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Hinoko-Setup.exe
          generate_release_notes: true
  linux-mac:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libx11-dev
      - run: cargo test --workspace --release
      - run: cargo build --release -p hinoko
      # one name per system, so the Linux and macOS binaries don't overwrite each other in the release
      - run: cp target/release/hinoko hinoko-${{ runner.os == 'macOS' && 'macos' || 'linux' }}-${{ runner.arch == 'ARM64' && 'arm64' || 'x86_64' }}
      - uses: actions/upload-artifact@v5
        with:
          name: hinoko-${{ matrix.os }}
          path: hinoko-*-*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: hinoko-*-*
